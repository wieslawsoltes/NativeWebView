name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: |
    10.0.x
    11.0.x
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  pack:
    name: Build and validate packages
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          printf 'PACKAGE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore NativeWebView.sln

      - name: Build release
        run: dotnet build NativeWebView.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test release
        run: dotnet test NativeWebView.sln -c Release --no-build

      - name: Validate diagnostics exit code contract
        run: ./scripts/validate-diagnostics-exit-code-contract.sh --configuration Release --no-build --output-dir "artifacts/diagnostics/exit-code-contract-$PACKAGE_VERSION" --baseline ci/baselines/blocking-issues-baseline.txt --fingerprint-baseline ci/baselines/diagnostics-fingerprint-baseline.txt

      - name: Desktop sample smoke
        run: ./scripts/run-desktop-sample-smoke.sh --configuration Release --no-build

      - name: Mobile/browser sample smoke
        run: ./scripts/run-mobile-browser-sample-smoke.sh --configuration Release --no-build --platform all

      - name: Platform diagnostics report
        run: ./scripts/run-platform-diagnostics-report.sh --configuration Release --no-build --platform all --output "artifacts/diagnostics/release-platform-diagnostics-$PACKAGE_VERSION.json" --markdown-output "artifacts/diagnostics/release-platform-diagnostics-$PACKAGE_VERSION.md" --blocking-baseline ci/baselines/blocking-issues-baseline.txt --blocking-baseline-output "artifacts/diagnostics/release-current-blocking-baseline-$PACKAGE_VERSION.txt" --comparison-markdown-output "artifacts/diagnostics/release-blocking-regression-$PACKAGE_VERSION.md" --comparison-json-output "artifacts/diagnostics/release-blocking-regression-$PACKAGE_VERSION.json" --comparison-evaluation-markdown-output "artifacts/diagnostics/release-gate-evaluation-$PACKAGE_VERSION.md" --require-baseline-sync --allow-not-ready

      - name: Pack release
        run: dotnet pack NativeWebView.sln -c Release --no-build -o artifacts/packages -p:ContinuousIntegrationBuild=true -p:Version="$PACKAGE_VERSION"

      - name: Validate package artifacts
        run: bash ./scripts/validate-nuget-packages.sh --package-dir artifacts/packages --version "$PACKAGE_VERSION" --markdown-output artifacts/packages/package-validation.md

      - name: Validate Windows package consumer
        run: bash ./scripts/validate-windows-package-consumer.sh --package-dir artifacts/packages --version "$PACKAGE_VERSION"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ env.PACKAGE_VERSION }}
          if-no-files-found: error
          path: |
            artifacts/packages/*

      - name: Upload diagnostics report artifact
        uses: actions/upload-artifact@v4
        with:
          name: platform-diagnostics-${{ env.PACKAGE_VERSION }}
          if-no-files-found: error
          path: |
            artifacts/diagnostics/release-platform-diagnostics-${{ env.PACKAGE_VERSION }}.json
            artifacts/diagnostics/release-platform-diagnostics-${{ env.PACKAGE_VERSION }}.md
            artifacts/diagnostics/release-current-blocking-baseline-${{ env.PACKAGE_VERSION }}.txt
            artifacts/diagnostics/release-blocking-regression-${{ env.PACKAGE_VERSION }}.md
            artifacts/diagnostics/release-blocking-regression-${{ env.PACKAGE_VERSION }}.json
            artifacts/diagnostics/release-gate-evaluation-${{ env.PACKAGE_VERSION }}.md
            artifacts/diagnostics/exit-code-contract-${{ env.PACKAGE_VERSION }}/*

      - name: Publish release summary
        if: always()
        run: |
          if [[ -f artifacts/packages/package-validation.md ]]; then
            cat artifacts/packages/package-validation.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Package validation summary was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Publish to NuGet.org
    needs: pack
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 11.0.x

      - name: Download validated packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packages-${{ needs.pack.outputs.version }}
          path: artifacts/packages

      - name: Sign in to NuGet.org with OIDC
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push packages and symbols
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          NUGET_SYMBOL_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/packages/*.nupkg" --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
          dotnet nuget push "artifacts/packages/*.snupkg" --source https://api.nuget.org/v3/index.json --skip-duplicate

  release:
    name: Create GitHub release
    needs: [pack, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download validated packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packages-${{ needs.pack.outputs.version }}
          path: artifacts/packages

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
